# ============================================
# Teeworlds RL - Configuration
# ============================================

server:
  host: "192.168.22.116"
  econ_port: 8304
  econ_password: "password"
  reconnect_delay: 2.0
  read_timeout: 0.0

visualizer:
  ip: "192.168.22.116"

capture:
  monitor:
    top: 0
    left: 0
    width: 800
    height: 600
  obs_width: 84
  obs_height: 84
  grayscale: false

input:
  aim_radius: 300
  keys:
    left: "a"
    right: "d"
    jump: "space"
    fire: "mouse_left"
    hook: "mouse_right"

env:
  tick_rate: 50
  max_steps: 150000
  reset_delay: 3.0

reward:
  kill: 10.0
  death: -2.0
  damage_dealt: 1.0
  survival_bonus: 0.0
  movement_scale: 0.1

# ============================================
# Multi-environnement (grille de clients)
# ============================================
multi_env:
  enabled: true             # false → mode single, true → mode grille
  n_envs: 12                 # nombre de clients (commence petit, augmente après)
  grid_cols: 2              # colonnes de la grille (null = auto √n)

  # Résolution de ton écran
  screen_width: 1920
  screen_height: 1080

  # Chemin vers le binaire client Teeworlds
  tw_binary: "/usr/games/teeworlds"

  # Port du serveur de jeu (pas econ)
  game_port: 8303

  # Délai entre chaque lancement de client (secondes)
  connect_delay: 0.1

training:
  architecture: "Ar_2"
  pretrained: false
  total_timesteps: 500_000
  learning_rate: 0.0001
  batch_size: 32
  gamma: 0.99
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 100
  buffer_size: 100_000
  min_buffer_size: 100
  target_update: 1000
  aim_weight: 1.0
  save_freq: 50_000
  save_path: "./reinforcement_learning/checkpoints"
  log_path: "./reinforcement_learning/logs"