<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Teeworlds RL - Live Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 12px; }
        header { text-align: center; margin-bottom: 14px; }
        header h1 { font-size: 1.4rem; color: #4CAF50; }
        header .info { color: #888; font-size: 0.78rem; margin-top: 4px; }
        header .info b { color: #bbb; }
        #video-grid { display: grid; gap: 10px; width: 100%; }
        .bot-card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .bot-card h3 { background: #2a2a2a; font-size: 0.8rem; color: #ccc; padding: 5px 10px; border-bottom: 1px solid #333; flex-shrink: 0; }
        .iframe-wrapper { position: relative; width: 100%; padding-bottom: 75%; background: #000; }
        .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>Teeworlds RL — Dashboard 📺</h1>
        <div class="info" id="status-info">Chargement…</div>
    </header>
    <div id="video-grid"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);

        async function loadConfig() {
            try {
                const res = await fetch('/config.json');
                if (!res.ok) throw new Error();
                const cfg = await res.json();
                return {
                    nEnvs: parseInt(urlParams.get('envs')) || cfg.n_envs || 12,
                    cols:  parseInt(urlParams.get('cols')) || cfg.cols   || 4,
                    host:  urlParams.get('host')           || cfg.host   || '127.0.0.1',
                };
            } catch {
                return {
                    nEnvs: parseInt(urlParams.get('envs')) || 12,
                    cols:  parseInt(urlParams.get('cols')) || 4,
                    host:  urlParams.get('host')           || '127.0.0.1',
                };
            }
        }

        async function init() {
            const { nEnvs, cols, host } = await loadConfig();

            document.getElementById('status-info').innerHTML =
                `<b>${nEnvs}</b> agents · VNC : <b>${host}</b> · <i>override via ?envs=N&cols=N&host=x.x.x.x</i>`;

            const grid = document.getElementById('video-grid');
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let i = 0; i < nEnvs; i++) {
                const wsPort = 6080 + i;
                const card = document.createElement('div');
                card.className = 'bot-card';

                const title = document.createElement('h3');
                title.textContent = `Agent ${i}  —  :${wsPort}`;

                const wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';

                const iframe = document.createElement('iframe');
                iframe.setAttribute('scrolling', 'no');
                iframe.src = `vnc_lite.html?host=${host}&port=${wsPort}&autoconnect=true&resize=scale&scale=true`;

                wrapper.appendChild(iframe);
                card.appendChild(title);
                card.appendChild(wrapper);
                grid.appendChild(card);
            }
        }

        init();
    </script>
</body>
</html>
