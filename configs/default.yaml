# ============================================
# Teeworlds RL - Configuration
# ============================================

server:
  host: "127.0.0.1"
  econ_port: 8303
  econ_password: "password"
  reconnect_delay: 2.0
  read_timeout: 0.05

capture:
  monitor:
    top: 0
    left: 0
    width: 800
    height: 600
  # ResNet50 attend du 224x224 RGB idéalement,
  # mais ça marche aussi en plus petit. 84x84 pour la vitesse.
  obs_width: 84
  obs_height: 84
  # IMPORTANT: false pour ResNet50 (3 canaux RGB requis)
  grayscale: false

input:
  aim_radius: 300
  keys:
    left: "a"
    right: "d"
    jump: "space"
    fire: "mouse_left"
    hook: "mouse_right"

env:
  tick_rate: 30
  max_steps: 3000
  reset_delay: 3.0

reward:
  kill: 1.0
  death: -1.0
  damage_dealt: 0.01
  survival_bonus: 0.001

training:
  # Architecture
  architecture: "Ar_2"     # "Ar_1" ou "Ar_2"
  pretrained: false         # Poids ImageNet pour ResNet50

  # DQN
  total_timesteps: 500_000
  learning_rate: 0.0001
  batch_size: 32
  gamma: 0.99

  # Epsilon-greedy
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 50_000

  # Replay buffer
  buffer_size: 100_000
  min_buffer_size: 1000

  # Target network
  target_update: 1000

  # Aim loss weight
  aim_weight: 1.0

  # Sauvegarde
  save_freq: 50_000
  save_path: "./checkpoints"
  log_path: "./logs"